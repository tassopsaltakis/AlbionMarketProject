name: Bug report
description: Report an incorrect result or broken workflow
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    attributes:
      label: Market context
      description: Item ID, region, city, quality, and observation time if relevant.
  - type: textarea
    attributes:
      label: Environment and evidence
      description: Browser, device, screenshots, or non-sensitive console errors.
